<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de fichier - webServ</title>
    <link rel="stylesheet" href="styles/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin: 20px 0;
        }
        input[type="file"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        .success {
            color: green;
            margin-top: 20px;
        }
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>

</head>
<body>
    <h1>Uploader un fichier</h1>
    <p>Sélectionnez un fichier à envoyer au serveur.</p>

    <form action="/upload-file" method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <input type="file" name="file" id="file" required>
        </div>
        <button type="submit">Uploader</button>
    </form>

    <div id="message" class="success" style="display: none;">
        Fichier uploadé avec succès !
    </div>
</body>
</html>
