server {
	listen 8080;

	location / { # on peut mettre combien d'arguments/parametres dans la directive location ?
		root /var/www/html;
		index index.html;
		error_page 404 /errors/404.html;
	}

}

server {
	listen 929hihi2; #attention gerer le atoi
	server_name werbserv.fr;
	client_max_body_size 134;

	location / {
		# server # attention il faut gerer ca pour lisntant c'est accepte
		root ./www ;
		allow_methods GET POST;
		autoindex on;
	}
	location /upload {
		root ./www;
		allow_methods GET DELETE POST;
		upload_loc ici ;
		upload_enable on;
		return 500 ici;
		error_page 404 /errors/404.html;
		error_page 500 502 503 504 /errors/50x.html;
		error_page 404 /errors/405.html;


	}
}


