server {
	listen 8080;

	location / { # on peut mettre combien d'arguments/parametres dans la directive location ?
		root sources/www;
		methods GET;
    autoindex on;
		index /index.html;
		error_page 404 404.html;
	}
  
  location upload/ { # on peut mettre combien d'arguments/parametres dans la directive location ?
		root sources/www;
		methods POST DELETE;
	}

}

server {
	listen 9292;

	location / { # on peut mettre combien d'arguments/parametres dans la directive location ?
		root sources/www;
		methods GET ;
		index index.html;
		error_page 404 404.html;
	}

  location upload/ { # on peut mettre combien d'arguments/parametres dans la directive location ?
		root sources/www;
		methods POST;
		autoindex on;
		index HelloWord.html;
		error_page 404 404.html;
	}


}

